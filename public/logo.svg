<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Background circle -->
  <circle cx="100" cy="100" r="96" fill="#0077BE" stroke="#005A8F" stroke-width="2"/>
  
  <!-- Scaffolding structure - vertical poles -->
  <rect x="42" y="38" width="7" height="124" fill="white" rx="2"/>
  <rect x="76" y="38" width="7" height="124" fill="white" rx="2"/>
  <rect x="117" y="38" width="7" height="124" fill="white" rx="2"/>
  <rect x="151" y="38" width="7" height="124" fill="white" rx="2"/>

  <!-- Scaffolding structure - horizontal planks -->
  <rect x="42" y="55" width="116" height="6" fill="white" rx="2"/>
  <rect x="42" y="88" width="116" height="6" fill="white" rx="2"/>
  <rect x="42" y="121" width="116" height="6" fill="white" rx="2"/>
  <rect x="42" y="154" width="116" height="6" fill="white" rx="2"/>

  <!-- Diagonal braces -->
  <line x1="42" y1="55" x2="83" y2="88" stroke="rgba(255,255,255,0.5)" stroke-width="3" stroke-linecap="round"/>
  <line x1="83" y1="55" x2="42" y2="88" stroke="rgba(255,255,255,0.5)" stroke-width="3" stroke-linecap="round"/>
  <line x1="117" y1="55" x2="158" y2="88" stroke="rgba(255,255,255,0.5)" stroke-width="3" stroke-linecap="round"/>
  <line x1="158" y1="55" x2="117" y2="88" stroke="rgba(255,255,255,0.5)" stroke-width="3" stroke-linecap="round"/>
  <line x1="42" y1="121" x2="83" y2="154" stroke="rgba(255,255,255,0.5)" stroke-width="3" stroke-linecap="round"/>
  <line x1="83" y1="121" x2="42" y2="154" stroke="rgba(255,255,255,0.5)" stroke-width="3" stroke-linecap="round"/>
  <line x1="117" y1="121" x2="158" y2="154" stroke="rgba(255,255,255,0.5)" stroke-width="3" stroke-linecap="round"/>
  <line x1="158" y1="121" x2="117" y2="154" stroke="rgba(255,255,255,0.5)" stroke-width="3" stroke-linecap="round"/>

  <!-- AMR text -->
  <text x="100" y="185" font-family="Arial Black, sans-serif" font-size="22" font-weight="900" fill="white" text-anchor="middle" letter-spacing="4">AMR</text>
</svg>

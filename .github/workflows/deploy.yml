name: Deploy to VPS

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/amr-echafaudage-frontend

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          envs: GITHUB_ACTOR,GHCR_PAT,IMAGE_FULL_NAME
          script: |
            echo "🚀 Starting deployment..."
            
            # Navigate to project directory
            cd ~/amr-echaufaudage || { echo "❌ Project directory not found"; exit 1; }
            echo "✅ In project directory"
            
            # Pull latest changes from git
            echo "📥 Pulling latest code..."
            git pull origin main || git pull origin master
            
            # Create network if it doesn't exist
            echo "🌐 Ensuring Docker network exists..."
            docker network create amr-network 2>/dev/null && echo "✅ Network created" || echo "✅ Network already exists"
            
            # The full image name
            IMAGE_NAME="ghcr.io/${{ github.repository }}/amr-echafaudage-frontend:latest"
            echo "📦 Image: $IMAGE_NAME"
            
            # Try to login to GHCR if PAT is provided (for private images)
            if [ -n "${{ secrets.GHCR_PAT }}" ]; then
              echo "🔐 Logging in to GHCR with PAT..."
              echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
              if [ $? -eq 0 ]; then
                echo "✅ Logged in to GHCR"
              else
                echo "⚠️  GHCR login failed, assuming image is public"
              fi
            else
              echo "ℹ️  No GHCR_PAT provided, assuming image is public"
            fi
            
            # Pull the latest image
            echo "📥 Pulling latest image..."
            docker pull "$IMAGE_NAME"
            if [ $? -ne 0 ]; then
              echo "❌ Failed to pull image"
              exit 1
            fi
            echo "✅ Image pulled successfully"
            
            # CRITICAL: Force remove old container with Docker restart if needed
            echo "🛑 Removing old container(s)..."
            
            # Try standard removal first
            CONTAINER_ID=$(docker ps -aq --filter "name=amr-frontend")
            if [ -n "$CONTAINER_ID" ]; then
              echo "Found container: $CONTAINER_ID"
              docker kill $CONTAINER_ID 2>/dev/null || true
              docker rm -f $CONTAINER_ID 2>/dev/null || true
              sleep 2
            fi
            
            # Check if container still exists
            if docker ps -a | grep -q amr-frontend; then
              echo "⚠️  Container still exists, restarting Docker service..."
              sudo systemctl restart docker
              sleep 5
              
              # Try again after restart
              CONTAINER_ID=$(docker ps -aq --filter "name=amr-frontend")
              if [ -n "$CONTAINER_ID" ]; then
                docker rm -f $CONTAINER_ID 2>/dev/null || true
                sleep 2
              fi
              
              # Final check
              if docker ps -a | grep -q amr-frontend; then
                echo "❌ Failed to remove container even after Docker restart"
                echo "Manual cleanup required: docker rm -f \$(docker ps -aq --filter 'name=amr-frontend')"
                exit 1
              fi
            fi
            
            echo "✅ All old containers removed"
            
            # Check if port 3000 is in use
            echo "🔍 Checking port 3000..."
            if sudo lsof -ti:3000 >/dev/null 2>&1; then
              echo "⚠️  Port 3000 is in use, freeing..."
              sudo lsof -ti:3000 | xargs -r sudo kill -9 2>/dev/null || true
              sleep 2
            fi
            
            # Start new container
            echo "🚀 Starting new container..."
            docker run -d \
              --name amr-frontend \
              --restart unless-stopped \
              --network amr-network \
              -p 3000:8080 \
              -e NODE_ENV=production \
              --health-cmd="wget --no-verbose --tries=1 --spider http://localhost:8080/health || exit 1" \
              --health-interval=30s \
              --health-timeout=3s \
              --health-retries=3 \
              --health-start-period=10s \
              "$IMAGE_NAME"
            
            if [ $? -eq 0 ]; then
              echo "✅ Container started successfully"
              sleep 5
              docker ps --filter "name=amr-frontend" --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
            else
              echo "❌ Failed to start container"
              docker logs amr-frontend 2>&1 || true
              exit 1
            fi
            
            # Clean up old images
            docker image prune -af --filter "until=24h" || true
            
            echo ""
            echo "✅ Deployment completed successfully!"

      - name: Verify deployment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            echo "🔍 Verifying deployment..."
            sleep 10
            
            if docker ps | grep -q amr-frontend; then
              echo "✅ Frontend container is running"
              docker ps --filter "name=amr-frontend" --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
              echo ""
              docker logs --tail 20 amr-frontend
              echo ""
              echo "🎉 Deployment successful!"
            else
              echo "❌ Container not running"
              docker ps -a --filter "name=amr-frontend"
              exit 1
            fi
